<!-- Operations Notification Email Template -->
<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>New FlagFusion Order Received</title>
  <style>
    :root {
      --background: #ffffff;
      --foreground: #393939;
      --light-grey: #f5f5f5;
      --light-highlight: #f5f5f5;
      --dark-highlight: #1a1a1a;
      --dark-grey: #d9d9d9;
      --selection: #418FDE;
    }
    body {
      background: var(--background);
      font-family: Arial, Helvetica, sans-serif;
      margin: 0;
      padding: 0;
      color: var(--foreground);
      background-image: radial-gradient(circle, var(--dark-grey) 1px, transparent 1px);
      background-size: 32px 32px;
    }
    .container {
      background: var(--background);
      max-width: 480px;
      margin: 40px auto;
      border-radius: 18px;
      border: 2px solid var(--light-grey);
      padding: 32px 28px;
      color: var(--foreground);
    }
    h2 {
      font-size: 2rem;
      margin-bottom: 0.5em;
      color: var(--foreground);
      font-family: 'American Typewriter', serif;
    }
    p {
      font-size: 1.1rem;
      margin: 1em 0;
    }
    .details {
      background: var(--light-grey);
      border-radius: 12px;
      padding: 1em 1.2em;
      font-size: 1em;
      margin: 1.5em 0;
      color: var(--foreground);
      border: 1px solid var(--dark-grey);
    }
    hr {
      border: none;
      border-top: 1px solid var(--light-grey);
      margin: 2em 0;
    }
    a {
      color: var(--selection);
    }
    @media (max-width: 600px) {
      .container {
        padding: 18px 6vw;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <h2>New Order Received</h2>
    <div class="details">
      <p>Order ID: <b>{{order_id}}</b></p>
      <p>Customer: {{customer_name}} ({{customer_email}})</p>
      <p>Shipping Address: {{shipping_address}}</p>
      <p>Order Details: {{order_details}}</p>
      <p>Flag Image: <a href="{{image_url}}" target="_blank">View Flag Image</a></p>
    </div>
    <hr>
    <p style="font-size:0.95em;color:#888;">Check Supabase for the flag image and further details.</p>
    <p style="font-size:1.1em;font-family:'American Typewriter',serif;">FlagFusion Operations</p>
  </div>
</body>
</html>
